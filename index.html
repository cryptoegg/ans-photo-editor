<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo Editor — A New Song</title>
<meta name="description" content="A free photo editor for carousels: Instagram, TikTok and YouTube in one go.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Bebas+Neue&family=Caveat:wght@500;700&family=DM+Serif+Display&family=Inter+Tight:wght@400;500;600;700;800&family=Playfair+Display:wght@400;700&family=Space+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="styles.css">
<!-- Installable (an icon on the dock / desktop, works offline): js/install.js -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f4fbf">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
<!-- The top bar (Style 2, like the Lyric Visualiser's): Home · File · Export · Post at the left; in the middle Edit | Phone,
     the platform being edited, and Feed | Profile (faint while editing); at the right ● the project's name and whether
     it's saved to your folder -->
<header class="topbar">
  <div class="topbar-left">
    <a id="btn-home" class="topbar-btn" href="/identity/" title="Back to Identity">Home</a>
    <button id="btn-file" class="topbar-btn" title="New, open, save, Settings, your projects">File</button>
    <button id="btn-export" class="topbar-btn">Export</button>
    <a id="btn-post" class="topbar-btn" href="/identity/calendar/" title="Your Social Media Calendar in Identity, to plan the post">Post</a>
  </div>
  <div class="topbar-centre">
    <div class="segmented" id="view-switch" role="tablist" aria-label="View">
      <button data-view="edit" class="on">Edit</button>
      <button data-view="phone">Phone</button>
    </div>
    <div class="segmented" id="platform-switch">
      <button data-mode="instagram" class="seg-icon" title="Instagram" aria-label="Instagram"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17" cy="7" r=".6" fill="currentColor"/></svg></button>
      <button data-mode="tiktok" class="seg-icon" title="TikTok" aria-label="TikTok"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18.5a3 3 0 1 1-3-3"/><path d="M9 18.5V4.5c.8 2.6 3 4.4 6 4.5"/></svg></button>
      <button data-mode="youtube" class="seg-icon" title="YouTube" aria-label="YouTube"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="5.5" width="19" height="13" rx="4"/><path d="M10.5 9.5v5l4.5-2.5z" fill="currentColor"/></svg></button>
    </div>
    <div class="segmented" id="phone-screens" title="Feed: the post as people scroll past it. Profile: how it sits on your page.">
      <button data-screen="feed" class="seg-icon on" title="Feed" aria-label="Feed"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><circle cx="9" cy="9" r="1.6"/><path d="M20 15l-4.5-4.5L6 20"/></svg></button>
      <button data-screen="profile" class="seg-icon" title="Profile" aria-label="Profile"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9.33 4v16M14.67 4v16M4 9.33h16M4 14.67h16"/></svg></button>
    </div>
  </div>
  <!-- the Editor's four tabs, over the Editor (js/main.js alignBar); the project's name is the window's title -->
  <div class="topbar-right" id="topbar-right">
  <nav class="kinds" id="tabs">
    <button data-tab="filters" class="on" title="Filters"><i class="k-ico"></i>Filters</button>
    <button data-tab="adjust" title="Adjust"><i class="k-ico"></i>Adjust</button>
    <button data-tab="crop" title="Crop"><i class="k-ico"></i>Crop</button>
    <button data-tab="text" title="Captions"><i class="k-ico"></i>Captions</button>
  </nav>
  </div>
</header>

<main class="workspace" id="workspace">
  <!-- Media (js/ui/mediaColumn.js): the project's photos and videos, and your saved filters -->
  <aside class="media-col" id="media-col"></aside>
  <section class="stage-area" id="stage-area">
    <!-- Edit view -->
    <div class="edit-view" id="edit-view">
      <canvas id="stage-canvas"></canvas>
      <div class="empty" id="empty-state" hidden>
        <h2>Drop photos here to get started</h2>
        <button class="btn primary" id="btn-empty-add">Add photos</button>
      </div>
      <div class="video-bar" id="video-bar" hidden></div>
      <!-- The canvas bar (Style 2, as the Lyric Visualiser's): the tools (Move · Remove · Clone · Eraser · Edge brush, from js/ui/brush.js), ‹ Slide 1 of 7 ›, the shape, − Fit +, guides, snapping,
           the background colour, Before (hold) -->
      <div class="stage-tools canvas-bar" id="canvas-bar">
        <span class="cb-tools" id="cb-tools"></span>
        <span class="cb-sep"></span>
        <button class="cb-icon" id="btn-slide-prev" title="Previous slide (←)" aria-label="Previous slide"></button>
        <span class="cb-slide" id="slide-of">Slide 1 of 1</span>
        <button class="cb-icon" id="btn-slide-next" title="Next slide (→)" aria-label="Next slide"></button>
        <span class="cb-sep"></span>
        <button type="button" id="ratio-select" class="cb-ratio" title="The set's shape"></button>
        <span class="cb-sep"></span>
        <button class="cb-icon" id="btn-zoom-out" title="Zoom out" aria-label="Zoom out"></button>
        <button class="cb-btn" id="btn-zoom-fit" title="Fit">Fit</button>
        <button class="cb-icon" id="btn-zoom-in" title="Zoom in" aria-label="Zoom in"></button>
        <span class="cb-sep"></span>
        <button class="cb-icon" id="btn-guides" title="Guides" aria-label="Guides"></button>
        <button class="cb-icon" id="btn-magnet" title="Snapping" aria-label="Snapping"></button>
        <label class="cb-icon cb-bg" id="bg-pick" title="Background colour"><input type="color" id="bg-colour" aria-label="Background colour"></label>
        <span class="cb-sep"></span>
        <button class="cb-btn" id="btn-before" title="Hold to see the photos without their look (or hold \)">Before</button>
        <span class="hint" id="before-hint" hidden>Before</span>
      </div>
    </div>
    <!-- Phone view -->
    <!-- Phone view (Style 2, as the Lyric Visualiser's): just the screen, rounded, on the dotted desk; ‹ › beside it;
         − Fit + in a floating bar under it -->
    <div class="phone-view" id="phone-view" hidden>
      <div class="phone-row">
        <button class="phone-nav" id="phone-prev" title="Previous slide (←)" aria-label="Previous slide"></button>
        <div class="phone-fit" id="phone-fit"><div class="phone" id="phone"></div></div>
        <button class="phone-nav" id="phone-next" title="Next slide (→)" aria-label="Next slide"></button>
      </div>
      <div class="stage-tools canvas-bar phone-bar">
        <button class="cb-icon" id="phone-zoom-out" title="Zoom out" aria-label="Zoom out"></button>
        <button class="cb-btn" id="phone-zoom-fit" title="Fit">Fit</button>
        <button class="cb-icon" id="phone-zoom-in" title="Zoom in" aria-label="Zoom in"></button>
      </div>
    </div>
  </section>

  <aside class="panel" id="panel">
    <!-- Style 2 (as the Lyric Visualiser's editor): Editor and its fold arrow; five kind tiles; the presets row; This slide | All;
         Layers; then the tile's own settings -->
    <div class="ed-head">
      <span class="ed-title">Editor</span>
      <button id="btn-undo" class="btn ghost icon undo-redo" title="Undo (⌘Z)" aria-label="Undo"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
      <button id="btn-redo" class="btn ghost icon undo-redo" title="Redo (⇧⌘Z)" aria-label="Redo"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
      <button type="button" class="ed-fold" id="btn-editor-fold" title="Fold the Editor" aria-label="Fold the Editor"></button>
    </div>
    <div class="presets-row" id="presets-row">
      <select class="select" id="preset-pick" aria-label="Presets"></select>
      <button type="button" class="btn" id="btn-save-preset">Save Preset</button>
      <button type="button" class="btn dice" id="btn-random" title="A random filter" aria-label="A random filter"></button>
    </div>
    <div class="segmented scope-seg" id="scope-switch">
      <button data-scope="one" class="on">This slide</button>
      <button data-scope="all">All</button>
    </div>
    <div class="layers-box" id="layers-box" hidden></div>
    <div class="layers-box tools-box" id="tools-box" hidden></div>
    <div class="tab-body" id="tab-body"></div>
  </aside>
</main>

<footer class="filmstrip-area">
  <!-- The slides strip's toolbar (Style 2, as the Lyric Visualiser's timeline bar): fold, Add (blue), trays of actions, the count -->
  <div class="strip-tools">
    <button type="button" class="strip-fold" id="btn-strip-fold" title="Fold the slides" aria-label="Fold the slides"></button>
    <button class="btn primary small" id="btn-add">Add photos or videos</button>
    <div class="tray">
      <button id="btn-duplicate" title="Duplicate (⌘D)">Duplicate</button>
      <button id="btn-pano" title="Join the selected slides into one panorama">Make panorama</button>
      <button id="btn-split" title="Turn a panorama back into separate slides">Split apart</button>
    </div>
    <div class="tray">
      <button id="btn-reset" title="Back to the photo as it came in">Reset</button>
      <button id="btn-delete" title="Remove from the set">Remove</button>
    </div>
    <span class="spacer"></span>
    <span class="count" id="slide-count">0 of 10</span>
  </div>
  <div class="filmstrip" id="filmstrip"></div>
</footer>

<input type="file" id="layer-input" accept="image/*,.heic,.heif" multiple hidden>
<input type="file" id="file-input" accept="image/*,.heic,.heif,video/mp4,video/quicktime,video/webm,.mp4,.mov,.m4v,.webm" multiple hidden>
<div class="toast" id="toast" hidden></div>
<div class="popover" id="projects-menu" hidden></div>
<div class="dialog-backdrop" id="export-dialog" hidden></div>
<div class="dialog-backdrop" id="ask-dialog" hidden></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
